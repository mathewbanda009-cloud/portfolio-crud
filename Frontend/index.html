<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio Manager</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h2 { margin-top: 0; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    label { display: block; font-size: .85rem; font-weight: bold; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: .95rem; font-family: inherit; }
    textarea { resize: vertical; min-height: 70px; }
    .full { grid-column: 1 / -1; }
    .actions { margin-top: 14px; display: flex; gap: 10px; }
    button { padding: 9px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: .9rem; }
    .btn-primary { background: #1f6feb; color: #fff; }
    .btn-secondary { background: #e3e6ea; }
    .btn-edit { background: #f0ad4e; color: #fff; padding: 6px 10px; }
    .btn-delete { background: #d9534f; color: #fff; padding: 6px 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f0f2f5; }
    td.row-actions { white-space: nowrap; display: flex; gap: 6px; }
    #message { margin-bottom: 14px; padding: 10px; border-radius: 5px; display: none; }
    #message.success { background: #dff0d8; color: #2d6a2d; display: block; }
    #message.error { background: #f8d7da; color: #8a1f2b; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio Manager</h1>
  </header>

  <main>
    <div id="message"></div>

    <section class="card">
      <h2 id="form-title">Add a portfolio</h2>
      <form id="portfolio-form">
        <input type="hidden" id="record-id" />
        <div class="grid">
          <div>
            <label for="owner_name">Owner name *</label>
            <input type="text" id="owner_name" required maxlength="120" />
          </div>
          <div>
            <label for="title">Title</label>
            <input type="text" id="title" maxlength="150" />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" maxlength="150" />
          </div>
          <div>
            <label for="website_url">Website URL</label>
            <input type="url" id="website_url" maxlength="255" />
          </div>
          <div>
            <label for="location">Location</label>
            <input type="text" id="location" maxlength="100" />
          </div>
          <div>
            <label for="skills">Skills (comma-separated)</label>
            <input type="text" id="skills" maxlength="255" />
          </div>
          <div class="full">
            <label for="bio">Bio</label>
            <textarea id="bio"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submit-btn">Add portfolio</button>
          <button type="button" class="btn-secondary" id="cancel-btn" style="display:none;">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>All portfolios</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Owner</th>
              <th>Title</th>
              <th>Skills</th>
              <th>Email</th>
              <th>Website</th>
              <th>Location</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="8">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
